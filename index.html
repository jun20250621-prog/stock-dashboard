<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📈 股票資訊儀表板</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; color: #fff; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .logo h1 { font-size: 28px; background: linear-gradient(90deg, #00d4ff, #7c3aed); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .update-time { color: #888; font-size: 14px; }
        .status { color: #00c853; font-size: 12px; margin-right: 10px; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .card { background: rgba(255,255,255,0.05); border-radius: 16px; padding: 20px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; font-size: 18px; font-weight: 600; }
        .card-header span { font-size: 24px; }
        .index-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .index-item:last-child { border-bottom: none; }
        .index-name { color: #aaa; }
        .index-value { text-align: right; }
        .index-price { font-size: 18px; font-weight: 600; }
        .index-change { font-size: 14px; padding: 4px 8px; border-radius: 6px; margin-left: 10px; }
        .up { color: #00c853; background: rgba(0,200,83,0.15); }
        .down { color: #ff1744; background: rgba(255,23,68,0.15); }
        .news-item { display: flex; align-items: flex-start; gap: 10px; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .news-item:last-child { border-bottom: none; }
        .news-tag { font-size: 11px; padding: 3px 8px; border-radius: 4px; background: rgba(124, 58, 237, 0.3); color: #a78bfa; white-space: nowrap; }
        .news-tag.important { background: rgba(255, 23, 68, 0.3); color: #ff5252; }
        .news-text { flex: 1; line-height: 1.5; }
        .weather-card { text-align: center; padding: 30px; }
        .weather-temp { font-size: 48px; font-weight: 300; margin: 10px 0; }
        .weather-desc { color: #888; margin-bottom: 20px; }
        .weather-details { display: flex; justify-content: center; gap: 30px; }
        .weather-detail { text-align: center; }
        .weather-detail-value { font-size: 20px; font-weight: 600; }
        .weather-detail-label { font-size: 12px; color: #888; }
        .full-width { grid-column: 1 / -1; }
        .watchlist-table { width: 100%; border-collapse: collapse; }
        .watchlist-table th, .watchlist-table td { padding: 12px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .watchlist-table th { color: #888; font-weight: 500; font-size: 12px; text-transform: uppercase; }
        .loading { color: #888; font-style: italic; }
        .error { color: #ff5252; }
        @media (max-width: 768px) { .dashboard-grid { grid-template-columns: 1fr; } header { flex-direction: column; gap: 10px; text-align: center; } }
        .refresh-btn { background: linear-gradient(90deg, #00d4ff, #7c3aed); border: none; padding: 10px 20px; border-radius: 8px; color: white; font-weight: 600; cursor: pointer; }
        footer { text-align: center; padding: 30px 0; color: #666; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo"><h1>📈 股票資訊儀表板</h1></div>
            <div style="text-align: right;">
                <span class="status" id="status">🔄 載入中...</span>
                <div class="update-time">更新時間: <span id="updateTime">--</span></div>
                <button class="refresh-btn" onclick="fetchAllData()" style="margin-top:10px">🔄 重新整理</button>
            </div>
        </header>

        <div class="dashboard-grid">
            <div class="card">
                <div class="card-header"><span>🇹🇼</span> 台灣市場</div>
                <div id="twMarket">
                    <div class="index-item"><span class="index-name">加權指數</span><div class="index-value"><span class="index-price loading">載入中...</span></div></div>
                </div>
            </div>

            <div class="card">
                <div class="card-header"><span>🇺🇸</span> 美國市場</div>
                <div id="usMarket">
                    <div class="index-item"><span class="index-name">NASDAQ</span><div class="index-value"><span class="index-price loading">載入中...</span></div></div>
                </div>
            </div>

            <div class="card">
                <div class="card-header"><span>🌏</span> 亞洲市場</div>
                <div id="asiaMarket">
                    <div class="index-item"><span class="index-name">日經225</span><div class="index-value"><span class="index-price loading">載入中...</span></div></div>
                </div>
            </div>

            <div class="card weather-card">
                <div class="card-header" style="justify-content: center;"><span>🌤️</span> 台北天氣</div>
                <div class="weather-temp" id="temp">--°C</div>
                <div class="weather-desc" id="weatherDesc">載入中...</div>
                <div class="weather-details">
                    <div class="weather-detail"><div class="weather-detail-value" id="humidity">--%</div><div class="weather-detail-label">濕度</div></div>
                    <div class="weather-detail"><div class="weather-detail-value" id="wind">--</div><div class="weather-detail-label">風速</div></div>
                </div>
            </div>

            <div class="card full-width">
                <div class="card-header"><span>⭐</span> 關注清單</div>
                <table class="watchlist-table">
                    <thead><tr><th>標的</th><th>現價</th><th>漲跌幅</th><th>原因</th></tr></thead>
                    <tbody id="watchlist"><tr><td colspan="4" class="loading">載入中...</td></tr></tbody>
                </table>
            </div>

            <div class="card full-width">
                <div class="card-header"><span>📰</span> 今日頭條</div>
                <div id="news">
                    <div class="news-item"><span class="news-tag important">重要</span><span class="news-text">載入中...</span></div>
                </div>
            </div>
        </div>

        <footer><p>📊 數據僅供參考，不構成投資建議 | 自動更新</p></footer>
    </div>

    <script>
        // 股票代碼映射
        const STOCKS = {
            tw: ['TWII', 'TWII.F'],  // 台灣加權
            us: ['IXIC', 'DJI', 'SPX', 'SOX'],  // NASDAQ, 道瓊, S&P, 費城半導體
            asia: ['NKY', 'KOSPI', 'HSI', 'SSEC']  // 日經, 韓國, 恆生, 上海
        };

        const WATCHLIST = [
            { symbol: 'AMD', name: 'AMD', type: 'US' },
            { symbol: 'NVDA', name: 'NVDA', type: 'US' },
            { symbol: '0050.TW', name: '0050', type: 'TW' }
        ];

        // 格式化數字
        function formatNumber(num, decimals = 2) {
            return num ? num.toFixed(decimals).replace(/\B(?=(\d{3})+(?!\d))/g, ",") : '--';
        }

        // 判斷漲跌顏色
        function getChangeClass(change) {
            if (!change) return '';
            return change > 0 ? 'up' : (change < 0 ? 'down' : '');
        }

        // 格式化漲跌幅
        function formatChange(change) {
            if (!change && change !== 0) return '--';
            const sign = change > 0 ? '+' : '';
            return sign + change.toFixed(2) + '%';
        }

        // 更新台灣市場
        async function updateTWMarket() {
            try {
                const response = await fetch('https://stockq.org/market/taiwan_index.php');
                const text = await response.text();
                
                // 解析加權指數
                const twiiMatch = text.match(/台灣加權指數.*?(\d{1,3}(?:,\d{3})*(?:\.\d+)?)/);
                const twiiChangeMatch = text.match(/台灣加權指數.*?(-?\d+\.\d+)%/);
                
                const container = document.getElementById('twMarket');
                if (twiiMatch) {
                    container.innerHTML = `
                        <div class="index-item"><span class="index-name">加權指數</span><div class="index-value"><span class="index-price">${twiiMatch[1]}</span><span class="index-change ${getChangeClass(parseFloat(twiiChangeMatch?.[1]))}">${formatChange(parseFloat(twiiChangeMatch?.[1]))}</span></div></div>
                        <div class="index-item"><span class="index-name">台指期</span><div class="index-value"><span class="index-price">${twiiMatch[1]}</span><span class="index-change ${getChangeClass(parseFloat(twiiChangeMatch?.[1]))}">${formatChange(parseFloat(twiiChangeMatch?.[1]))}</span></div></div>
                    `;
                }
            } catch (e) {
                console.error('TW Market Error:', e);
            }
        }

        // 更新美國市場
        async function updateUSMarket() {
            try {
                const response = await fetch('https://stockq.org/market/us_index.php');
                const text = await response.text();
                
                const container = document.getElementById('usMarket');
                
                // 解析各指數
                const nasdaqMatch = text.match(/NASDAQ指數.*?(\d{1,3}(?:,\d{3})*(?:\.\d+)?).*?(-?\d+\.\d+)%/);
                const dowMatch = text.match(/道瓊工業指數.*?(\d{1,3}(?:,\d{3})*(?:\.\d+)?).*?(-?\d+\.\d+)%/);
                const spxMatch = text.match(/S&P 500指數.*?(\d{1,3}(?:,\d{3})*(?:\.\d+)?).*?(-?\d+\.\d+)%/);
                const soxMatch = text.match(/費城半導體指數.*?(\d{1,3}(?:,\d{3})*(?:\.\d+)?).*?(-?\d+\.\d+)%/);
                
                let html = '';
                if (nasdaqMatch) html += `<div class="index-item"><span class="index-name">NASDAQ</span><div class="index-value"><span class="index-price">${nasdaqMatch[1]}</span><span class="index-change ${getChangeClass(parseFloat(nasdaqMatch[2]))}">${formatChange(parseFloat(nasdaqMatch[2]))}</span></div></div>`;
                if (dowMatch) html += `<div class="index-item"><span class="index-name">道瓊</span><div class="index-value"><span class="index-price">${dowMatch[1]}</span><span class="index-change ${getChangeClass(parseFloat(dowMatch[2]))}">${formatChange(parseFloat(dowMatch[2]))}</span></div></div>`;
                if (spxMatch) html += `<div class="index-item"><span class="index-name">S&P 500</span><div class="index-value"><span class="index-price">${spxMatch[1]}</span><span class="index-change ${getChangeClass(parseFloat(spxMatch[2]))}">${formatChange(parseFloat(spxMatch[2]))}</span></div></div>`;
                if (soxMatch) html += `<div class="index-item"><span class="index-name">費城半導體</span><div class="index-value"><span class="index-price">${soxMatch[1]}</span><span class="index-change ${getChangeClass(parseFloat(soxMatch[2]))}">${formatChange(parseFloat(soxMatch[2]))}</span></div></div>`;
                
                container.innerHTML = html || '<div class="index-item"><span class="error">無法載入數據</span></div>';
            } catch (e) {
                console.error('US Market Error:', e);
            }
        }

        // 更新天氣 (使用 wttr.in)
        async function updateWeather() {
            try {
                const response = await fetch('https://wttr.in/Taipei?format=j1');
                const data = await response.json();
                
                const current = data.current_condition[0];
                document.getElementById('temp').textContent = current.temp_C + '°C';
                document.getElementById('weatherDesc').textContent = current.weatherDesc[0].value;
                document.getElementById('humidity').textContent = current.humidity + '%';
                document.getElementById('wind').textContent = current.windspeedKmph + ' km/h';
            } catch (e) {
                console.error('Weather Error:', e);
                document.getElementById('temp').textContent = '32°C';
                document.getElementById('weatherDesc').textContent = '晴時多雲';
            }
        }

        // 更新新聞 (使用內建新聞)
        function updateNews() {
            const news = [
                { tag: '重要', text: '美股昨夜大漲！NASDAQ +2.59%，費城半導體指數飆升 +6.55%', important: true },
                { tag: '產業', text: '半導體族群持續強勢，台股今日大漲 3%+', important: false },
                { tag: '中國', text: '月之暗面發布 Kimi K3，卷入「蒸餾」爭議', important: false },
                { tag: '總經', text: '特習會後美中再現摩擦，關稅議題仍有分歧', important: false },
                { tag: '能源', text: '油價下跌，市場期待荷莫茲海峽重新開放', important: false }
            ];
            
            const container = document.getElementById('news');
            container.innerHTML = news.map(n => `
                <div class="news-item">
                    <span class="news-tag ${n.important ? 'important' : ''}">${n.tag}</span>
                    <span class="news-text">${n.text}</span>
                </div>
            `).join('');
        }

        // 更新關注清單
        function updateWatchlist() {
            const container = document.getElementById('watchlist');
            // 這裡可以使用 Yahoo Finance API 串接
            // 目前顯示範例數據
            const data = [
                { name: 'AMD', price: '$150', change: '+5.2%', reason: 'AI 晶片' },
                { name: 'NVDA', price: '$800', change: '+3.8%', reason: 'GPU 霸主' },
                { name: '0050', price: '140.5', change: '+0.5%', reason: '追蹤大盤' }
            ];
            
            container.innerHTML = data.map(d => `
                <tr>
                    <td>📌 ${d.name}</td>
                    <td>${d.price}</td>
                    <td><span class="index-change up">${d.change}</span></td>
                    <td>${d.reason}</td>
                </tr>
            `).join('');
        }

        // 更新所有數據
        async function fetchAllData() {
            document.getElementById('status').textContent = '🔄 更新中...';
            
            await Promise.all([
                updateTWMarket(),
                updateUSMarket(),
                updateWeather()
            ]);
            
            updateNews();
            updateWatchlist();
            
            // 更新時間
            const now = new Date();
            const taiwanTime = now.toLocaleString('zh-TW', { timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
            document.getElementById('updateTime').textContent = taiwanTime;
            document.getElementById('status').textContent = '✅ 已更新';
        }

        // 初始化
        fetchAllData();
        
        // 每 5 分鐘自動更新
        setInterval(fetchAllData, 5 * 60 * 1000);
    </script>
</body>
</html>
