<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>股票儀表板 - 即時行情</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .last-update {
            color: #888;
            font-size: 0.9rem;
        }
        
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(26, 26, 46, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.3s ease;
        }
        
        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #333;
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-text {
            margin-top: 20px;
            color: #888;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .card-title {
            font-size: 1.1rem;
            color: #888;
        }
        
        .card-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .badge-taiwan { background: #dc2626; }
        .badge-us { background: #2563eb; }
        .badge-vix { background: #7c3aed; }
        
        .price {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .change {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
        }
        
        .change.up { color: #ef4444; }
        .change.down { color: #22c55e; }
        
        .error-card {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
        }
        
        .error-message {
            color: #ef4444;
            text-align: center;
            padding: 20px;
        }
        
        .refresh-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.4);
            transition: transform 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .refresh-btn:hover {
            transform: scale(1.1);
        }
        
        .refresh-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .refresh-btn.spinning svg {
            animation: spin 1s linear infinite;
        }
        
        /* 爬蟲數據區塊 */
        .scraper-section {
            margin-top: 30px;
        }
        
        .scraper-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #00d4ff;
        }
        
        .scraper-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
        }
        
        .scraper-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .scraper-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .scraper-item:last-child {
            border-bottom: none;
        }
        
        .scraper-label {
            color: #888;
        }
        
        .scraper-value {
            font-weight: 600;
        }
        
        .no-data {
            text-align: center;
            color: #666;
            padding: 40px;
        }
        
        /* 響應式 */
        @media (max-width: 768px) {
            body {
                padding: 12px;
            }
            
            h1 {
                font-size: 1.5rem;
            }
            
            .price {
                font-size: 2rem;
            }
            
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <div class="loading-text">載入行情資料中...</div>
    </div>
    
    <div class="container">
        <header>
            <h1>📈 股票儀表板</h1>
            <div class="last-update">最後更新: <span id="lastUpdate">-</span></div>
        </header>
        
        <div class="grid" id="mainGrid">
            <!-- 台股加權指數 -->
            <div class="card" id="twseCard">
                <div class="card-header">
                    <span class="card-title">加權指數 (TAIEX)</span>
                    <span class="card-badge badge-taiwan">台灣</span>
                </div>
                <div class="price" id="twsePrice">載入中...</div>
                <div class="change" id="twseChange">
                    <span>...</span>
                </div>
            </div>
            
            <!-- NASDAQ -->
            <div class="card" id="nasdaqCard">
                <div class="card-header">
                    <span class="card-title">NASDAQ Composite</span>
                    <span class="card-badge badge-us">美國</span>
                </div>
                <div class="price" id="nasdaqPrice">載入中...</div>
                <div class="change" id="nasdaqChange">
                    <span>...</span>
                </div>
            </div>
            
            <!-- S&P 500 -->
            <div class="card" id="sp500Card">
                <div class="card-header">
                    <span class="card-title">S&P 500</span>
                    <span class="card-badge badge-us">美國</span>
                </div>
                <div class="price" id="sp500Price">載入中...</div>
                <div class="change" id="sp500Change">
                    <span>...</span>
                </div>
            </div>
            
            <!-- VIX -->
            <div class="card" id="vixCard">
                <div class="card-header">
                    <span class="card-title">VIX 恐慌指數</span>
                    <span class="card-badge badge-vix">波動率</span>
                </div>
                <div class="price" id="vixPrice">載入中...</div>
                <div class="change" id="vixChange">
                    <span>...</span>
                </div>
            </div>
        </div>
        
        <!-- 爬蟲數據區塊 -->
        <div class="scraper-section">
            <h2 class="scraper-title">🤖 DataTrack 爬蟲資料</h2>
            <div class="scraper-grid" id="scraperGrid">
                <div class="no-data">載入爬蟲資料中...</div>
            </div>
        </div>
    </div>
    
    <button class="refresh-btn" id="refreshBtn" title="重新整理" onclick="refreshAll()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
    </button>
    
    <script>
        // API 端點配置
        const API_CONFIG = {
            // Yahoo Finance CORS 代理
            yahooProxy: 'https://api.allorigins.win/raw?url=',
            // TWSE 台灣證交所 API
            twse: 'https://tw.api.omega.run/',
            // 爬蟲數據 endpoint
            scraper: './api/scraper-data.json'
        };
        
        // 股票代碼
        const SYMBOLS = {
            twse: '^TWII',
            nasdaq: '^IXIC',
            sp500: '^GSPC',
            vix: '^VIX'
        };
        
        // 全域狀態
        let isLoading = true;
        let refreshInterval = null;
        
        // 格式化數字
        function formatNumber(num, decimals = 2) {
            if (num === null || num === undefined || isNaN(num)) return '-';
            return Number(num).toLocaleString('en-US', {
                minimumFractionDigits: decimals,
                maximumFractionDigits: decimals
            });
        }
        
        // 格式化價格變動
        function formatChange(change, percent) {
            const sign = change >= 0 ? '+' : '';
            return `${sign}${formatNumber(change)} (${sign}${formatNumber(percent)}%)`;
        }
        
        // 更新 UI 顯示
        function updateCard(symbol, price, change, percent, cardId, changeId, priceId) {
            const card = document.getElementById(cardId);
            const priceEl = document.getElementById(priceId);
            const changeEl = document.getElementById(changeId);
            
            if (price === null) {
                card.classList.add('error-card');
                priceEl.textContent = '取得失敗';
                changeEl.innerHTML = '<span>請稍後再試</span>';
                changeEl.className = 'change';
                return;
            }
            
            card.classList.remove('error-card');
            priceEl.textContent = formatNumber(price);
            
            const isUp = change >= 0;
            changeEl.className = `change ${isUp ? 'up' : 'down'}`;
            changeEl.innerHTML = `<span>${formatChange(change, percent)}</span>`;
        }
        
        // 顯示錯誤
        function showError(cardId, priceId, changeId, message) {
            const card = document.getElementById(cardId);
            const priceEl = document.getElementById(priceId);
            const changeEl = document.getElementById(changeId);
            
            card.classList.add('error-card');
            priceEl.textContent = '錯誤';
            changeEl.innerHTML = `<span>${message}</span>`;
            changeEl.className = 'change';
        }
        
        // 從 Yahoo Finance 獲取數據
        async function fetchYahooData(symbol) {
            try {
                const url = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(symbol)}?interval=1d&range=1d`;
                const response = await fetch(url, {
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                const result = data.chart?.result?.[0];
                
                if (!result) throw new Error('無資料');
                
                const meta = result.meta;
                const quote = result.indicators?.quote?.[0];
                
                return {
                    price: meta.regularMarketPrice || meta.previousClose,
                    change: meta.regularMarketChange || (meta.regularMarketPrice - meta.previousClose),
                    percent: meta.regularMarketChangePercent || ((meta.regularMarketPrice - meta.previousClose) / meta.previousClose * 100)
                };
            } catch (error) {
                console.error(`Yahoo ${symbol} error:`, error);
                return { price: null, error: error.message };
            }
        }
        
        // 從 TWSE 獲取台股數據
        async function fetchTWSEData() {
            try {
                // 使用 TWSE 公開 API
                const response = await fetch('https://tw.api.omega.run/v1/index', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        indexId: "IX0001",  // 加權指數
                        startDate: new Date().toISOString().split('T')[0],
                        endDate: new Date().toISOString().split('T')[0]
                    })
                });
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                const item = data.data?.[0];
                
                if (!item) throw new Error('無資料');
                
                return {
                    price: parseFloat(item.s),
                    change: parseFloat(item.ch),
                    percent: parseFloat(item.cp)
                };
            } catch (error) {
                console.error('TWSE error:', error);
                
                // 備用方案：使用 Yahoo Finance
                return fetchYahooData(SYMBOLS.twse);
            }
        }
        
        // 獲取所有市場數據
        async function fetchMarketData() {
            const [twse, nasdaq, sp500, vix] = await Promise.all([
                fetchTWSEData(),
                fetchYahooData(SYMBOLS.nasdaq),
                fetchYahooData(SYMBOLS.sp500),
                fetchYahooData(SYMBOLS.vix)
            ]);
            
            return { twse, nasdaq, sp500, vix };
        }
        
        // 更新市場數據顯示
        function updateMarketUI(data) {
            updateCard('twse', data.twse.price, data.twse.change, data.twse.percent, 'twseCard', 'twseChange', 'twsePrice');
            updateCard('nasdaq', data.nasdaq.price, data.nasdaq.change, data.nasdaq.percent, 'nasdaqCard', 'nasdaqChange', 'nasdaqPrice');
            updateCard('sp500', data.sp500.price, data.sp500.change, data.sp500.percent, 'sp500Card', 'sp500Change', 'sp500Price');
            updateCard('vix', data.vix.price, data.vix.change, data.vix.percent, 'vixCard', 'vixChange', 'vixPrice');
        }
        
        // 載入爬蟲數據
        async function loadScraperData() {
            const grid = document.getElementById('scraperGrid');
            
            try {
                const response = await fetch('./api/scraper-data.json?t=' + Date.now());
                
                if (!response.ok) {
                    throw new Error('爬蟲資料尚未生成');
                }
                
                const data = await response.json();
                
                if (!data || Object.keys(data).length === 0) {
                    throw new Error('無爬蟲資料');
                }
                
                let html = '';
                for (const [key, value] of Object.entries(data)) {
                    html += `
                        <div class="scraper-card">
                            <div class="scraper-item">
                                <span class="scraper-label">${key}</span>
                                <span class="scraper-value">${value}</span>
                            </div>
                        </div>
                    `;
                }
                
                grid.innerHTML = html;
            } catch (error) {
                grid.innerHTML = `<div class="no-data">📊 爬蟲資料載入失敗: ${error.message}<br>請確認 DataTrack 爬蟲已執行並產生資料</div>`;
            }
        }
        
        // 隱藏載入画面
        function hideLoading() {
            const overlay = document.getElementById('loadingOverlay');
            overlay.classList.add('hidden');
            isLoading = false;
        }
        
        // 顯示載入画面
        function showLoading() {
            const overlay = document.getElementById('loadingOverlay');
            overlay.classList.remove('hidden');
            isLoading = true;
        }
        
        // 更新最後更新時間
        function updateLastTime() {
            const now = new Date();
            const timeStr = now.toLocaleString('zh-TW', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            document.getElementById('lastUpdate').textContent = timeStr;
        }
        
        // 重新整理所有數據
        async function refreshAll() {
            const btn = document.getElementById('refreshBtn');
            btn.classList.add('spinning');
            btn.disabled = true;
            
            showLoading();
            
            try {
                const data = await fetchMarketData();
                updateMarketUI(data);
                await loadScraperData();
                updateLastTime();
            } catch (error) {
                console.error('Refresh error:', error);
            } finally {
                btn.classList.remove('spinning');
                btn.disabled = false;
                hideLoading();
            }
        }
        
        // 初始化
        async function init() {
            showLoading();
            
            try {
                const data = await fetchMarketData();
                updateMarketUI(data);
                await loadScraperData();
                updateLastTime();
                
                // 每分鐘自動更新
                if (refreshInterval) clearInterval(refreshInterval);
                refreshInterval = setInterval(refreshAll, 60000);
            } catch (error) {
                console.error('Init error:', error);
            } finally {
                hideLoading();
            }
        }
        
        // 啟動
        init();
    </script>
</body>
</html>
