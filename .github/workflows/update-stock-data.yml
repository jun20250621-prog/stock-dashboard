name: Update Stock Data

on:
  workflow_dispatch:
  schedule:
    # 台灣時間 09:00 (UTC 01:00) 與 15:00 (UTC 07:00)，週一至五
    - cron: "0 1,7 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests tzdata

      - name: Run scraper
        run: python scripts/fetch_data.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add api/*.json api/*.js
          git diff --cached --quiet || git commit -m "chore: 更新股票資料 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
